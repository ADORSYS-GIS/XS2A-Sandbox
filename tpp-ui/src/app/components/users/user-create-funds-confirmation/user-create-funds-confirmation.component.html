<div class="container-fluid">
  <div class="card">
    <div class="card-body--large">
      <a href="javascript:void(0);" (click)="handleClickOnBackButton()">
        <button class="btn btn-sm btn-outline-secondary mb-5">&lt; Back</button>
      </a>
      <form
        (ngSubmit)="onSubmit()"
        [formGroup]="createFundsFormGroup"
        *ngIf="user"
        novalidate
      >
        <div class="header__title">Create Funds Confirmation Consent</div>
        <div class="row">
          <div class="col-12 col-md-4">
            <label class="mb-2 mt-4" for="password"
              >Password for {{ this.user.login }}</label
            >
            <input
              autocomplete="new-password"
              class="form-control"
              formControlName="password"
              id="password"
              placeholder="Enter Password"
              type="password"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-4">
            <label class="mb-2 mt-4" for="iban">IBAN</label>
            <input
              class="form-control"
              formControlName="iban"
              id="iban"
              placeholder="Enter IBAN"
              type="text"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-4 mt-4">
            <label for="currency">Desired currency*</label>
            <select
              name="currency"
              class="form-control"
              formControlName="currency"
              id="currency"
            >
              <option
                *ngFor="let currency of currencyList"
                [ngValue]="currency"
              >
                {{ currency }}
              </option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-4">
            <label class="mb-2 mt-4" for="tppAuthorisationNumber"
              >TPP Authorisation Number</label
            >
            <input
              class="form-control"
              formControlName="tppAuthorisationNumber"
              placeholder="Enter TPP Authorisation Number"
              id="tppAuthorisationNumber"
              type="text"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-4">
            <label class="mb-2 mt-4" for="validUntil">Valid until</label>
            <input
              class="form-control"
              formControlName="validUntil"
              id="validUntil"
              type="date"
            />
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>
        <div [style.visibility]="errorDate" class="alert">
          Please choose a date in the future!
        </div>
        <div class="form-group d-flex flex-row pt-2 mt-5">
          <button
            class="btn btn-primary"
            [disabled]="createFundsFormGroup.invalid"
            type="submit"
          >
            Create
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
